{% extends "base.html" %}

{% block title %}Мои записи{% endblock %}

{% block content %}
<h1>Мои записи</h1>
{% for card in cards %}
<a href="{{ url_for('card', id=card.id) }}">
  {{ card.title }}
  {{ card.subtitle }}
</a>
{% endfor %}
<a href="{{ url_for('create') }}">Создать</a>
<a href="{{ url_for('logout') }}">Выйти</a>
{% endblock %}
