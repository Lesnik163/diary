{% extends "base.html" %}

{% block title %}Создание{% endblock %}

{% block content %}
<form method="POST" action="{{ url_for('form_create') }}">
  <input type="text" name="title" placeholder="Введите заголовок">
  <input type="text" name="subtitle" placeholder="Введите подзаголовок">
  <textarea name="text" placeholder="Напишите что-нибудь..."></textarea>
  <button type="submit">Создать</button>
</form>
<a href="{{ url_for('index') }}">На главную</a>
{% endblock %}
